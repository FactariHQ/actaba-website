<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#233f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Labors">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>My Labors</title>
<style>html,body{margin:0;background:#f6f1e6;color:#1c2a3a;font:17px/1.4 system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme: dark){html,body{background:#0f1622;color:#f1e9d8}}
.c{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.s{width:28px;height:28px;border-radius:50%;border:4px solid #b8892b;border-right-color:transparent;animation:r .8s linear infinite;margin:14px auto}
@keyframes r{to{transform:rotate(360deg)}}</style>
</head>
<body><div class="c"><div><div style="font-size:44px">🏛️</div><div id="m">Opening the gates of Olympus…</div><div class="s" id="sp"></div></div></div>
<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbyzYR5TGP8vcOVMD9Epm1hyfWFJzfCBfVP29pFMDg5O0vGx5Du3prvlT3dNeMwdgad0/exec";
  function show(html) { document.open(); document.write(html); document.close(); }
  function fail() {
    var c = null; try { c = localStorage.getItem('kylie.app'); } catch (e) {}
    if (c) return show(c);
    document.getElementById('sp').style.display = 'none';
    document.getElementById('m').innerHTML = 'Can’t reach Olympus right now.<br>Check your Wi-Fi or signal, then <a href="" style="color:#b8892b">try again</a>.';
  }
  fetch(API + '?asset=kid', { credentials: 'omit', cache: 'no-store', redirect: 'follow' })
    .then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (t) { if (t.indexOf('id="view-labors"') < 0) throw 0; try { localStorage.setItem('kylie.app', t); } catch (e) {} show(t); })
    .catch(fail);
})();
</script>
</body>
</html>
